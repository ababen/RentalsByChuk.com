<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business card front</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&amp;family=Sora:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 336px; height: 192px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B1D3A; color: #FFFFFF; font-family: 'Inter', sans-serif; padding: 20px 22px 18px; display: flex; flex-direction: column; justify-content: space-between">
  <div style="position: absolute; right: -46px; top: -46px; width: 150px; height: 150px; border-radius: 999px; border: 18px solid #13294B" aria-hidden="true"></div>
  <div style="position: relative; display: flex; align-items: center; gap: 10px">
    <svg width="38" height="38" viewBox="0 0 56 56" role="img" aria-label="RentalsByChuk monogram">
      <rect x="0" y="0" width="56" height="56" rx="14" fill="#FFFFFF"></rect>
      <g transform="translate(5,6)">
        <path d="M10 8 H22 C29 8 32 13 32 18 C32 23 29 28 22 28 H14 V40 H10 V8 Z M14 24 H21 C26 24 28 21 28 18 C28 15 26 12 21 12 H14 V24 Z" fill="#0B1D3A"></path>
        <path d="M22 28 C22 28 28 31 31 36" stroke="#0FB5A3" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
        <path d="M21 30 C23 32 27 34 30 33" stroke="#FF6B4A" stroke-width="2.2" stroke-linecap="round" fill="none"></path>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 3px">
      <div style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -0.01em; line-height: 1">RENTALS <span style="color: {{accent}}">BY</span> CHUK</div>
      <div style="font-size: 7.5px; font-weight: 700; letter-spacing: 0.16em; color: #2EC4B6; line-height: 1.2">WEST PALM BEACH • PALM BEACH GARDENS • JUPITER</div>
    </div>
  </div>
  <div style="position: relative; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -0.01em">Your next rental,<br>and move, <i style="font-weight: 500; color: {{accent}}">handled.</i></p>
    <div style="display: flex; gap: 4px" aria-hidden="true">
      <div style="width: 28px; height: 3px; border-radius: 2px; background: {{accent}}"></div>
      <div style="width: 14px; height: 3px; border-radius: 2px; background: #2EC4B6"></div>
      <div style="width: 8px; height: 3px; border-radius: 2px; background: #E8DDD0"></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF6B4A","options":["#FF6B4A","#2EC4B6","#E8DDD0"]},"$preview":{"width":336,"height":192}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#FF6B4A' };
  }
}
</script>
</body>
</html>
